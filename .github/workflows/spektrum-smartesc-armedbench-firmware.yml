# Separate, explicitly opt-in Pixhawk6C ArmedBench compile; never flash automatically.
name: Spektrum ArmedBench firmware build
on:
  push:
    branches:
      - feature/spktsmart-armedbench-armtest-20261113
      - feature/spktsmart-auto-poweron-20261113
      - feature/spktsmart-boot-timing-fix-20261113
      - feature/spktsmart-aux7-internal-pullup-20261113
      - feature/spktsmart-native-early-poweron-20261114
      - feature/spktsmart-revk-recovery-20261114
      - feature/spktsmart-recovery-safety-20261114
      - feature/spktsmart-ev3-rc-observer-20261114
      - feature/spktsmart-early-armedbench-throttlecut-20261114
      - feature/spktsmart-f7-startup-recovery-20261114
      - feature/spktsmart-pullup-delayed-rxdiag-20261116
      - feature/spktsmart-autoboot-fastdiscovery-20261116
      - feature/spktsmart-early200-listen-20261116
      - feature/spktsmart-early200-handshake-lab-20261116
    paths:
      - 'libraries/AP_SpektrumSmartESC/**'
      - 'libraries/AP_Arming/AP_Arming.cpp'
      - 'libraries/AP_Vehicle/AP_Vehicle.h'
      - 'libraries/AP_HAL_ChibiOS/DiagnosticRX.cpp'
      - 'libraries/AP_HAL_ChibiOS/SpektrumUART4.cpp'
      - 'libraries/AP_HAL_ChibiOS/HAL_ChibiOS_Class.cpp'
      - 'libraries/AP_HAL/UARTDriver.h'
      - 'libraries/AP_Vehicle/AP_Vehicle.cpp'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-ArmedBench-IOInstall/**'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-EarlyNative-IOInstall/**'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-EarlyArmedBench-IOInstall/**'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-EarlyArmedBench-DelayedRxDiag-IOInstall/**'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-EarlyArmedBench-AutoBoot-IOInstall/**'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-EarlyArmedBench-Early200-IOInstall/**'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-Early200-HSOnly-IOInstall/**'
      - '.github/workflows/spektrum-smartesc-armedbench-firmware.yml'
  pull_request:
    paths:
      - 'libraries/AP_SpektrumSmartESC/**'
      - 'libraries/AP_Arming/AP_Arming.cpp'
      - 'libraries/AP_Vehicle/AP_Vehicle.h'
      - 'libraries/AP_HAL_ChibiOS/DiagnosticRX.cpp'
      - 'libraries/AP_HAL_ChibiOS/SpektrumUART4.cpp'
      - 'libraries/AP_HAL_ChibiOS/HAL_ChibiOS_Class.cpp'
      - 'libraries/AP_HAL/UARTDriver.h'
      - 'libraries/AP_Vehicle/AP_Vehicle.cpp'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-ArmedBench-IOInstall/**'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-EarlyNative-IOInstall/**'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-EarlyArmedBench-IOInstall/**'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-EarlyArmedBench-DelayedRxDiag-IOInstall/**'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-EarlyArmedBench-AutoBoot-IOInstall/**'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-EarlyArmedBench-Early200-IOInstall/**'
      - 'libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-Early200-HSOnly-IOInstall/**'
  workflow_dispatch:
jobs:
  build-armedbench:
    runs-on: ubuntu-22.04
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile and run Spektrum host regression suites
        run: python3 libraries/AP_SpektrumSmartESC/tests/run_host_tests.py
      - name: Compile special IOMCU and ArmedBench ArduPlane
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/gcc-arm-none-eabi-10/bin:/github/home/.local/bin:$PATH"
          ./waf configure --board iomcu-f103-spktsmart
          ./waf iofirmware
          test -s build/iomcu-f103-spktsmart/bin/iofirmware_lowpolh.bin
          ./waf configure --board Pixhawk6C-SpktSmart-ArmedBench-IOInstall
          ./waf plane
          test -s build/Pixhawk6C-SpktSmart-ArmedBench-IOInstall/bin/arduplane.apj
          strings build/Pixhawk6C-SpktSmart-ArmedBench-IOInstall/bin/arduplane | grep -F 'SPK28 ARM MON%u RET%u RDY%u'
          strings build/Pixhawk6C-SpktSmart-ArmedBench-IOInstall/bin/arduplane | grep -F 'SPK29 HS ST%u Q%lu FIRST%lums'
          strings build/Pixhawk6C-SpktSmart-ArmedBench-IOInstall/bin/arduplane | grep -F 'SPK30 PA0 PU%u MODE%u'
          # A real PA0 pull-up must be present in all three ownership phases.
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_AUX7_INTERNAL_PULLUP 1' libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-ArmedBench-IOInstall/hwdef.dat
          grep -Fq 'PAL_STM32_PUPDR_PULLUP' libraries/AP_HAL_ChibiOS/DiagnosticRX.cpp
          grep -Fq 'PAL_STM32_PUPDR_PULLUP' libraries/AP_HAL_ChibiOS/SpektrumUART4.cpp
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/Pixhawk6C-SpktSmart-ArmedBench-IOInstall/bin/arduplane.apj')
          a=json.loads(p.read_text())
          assert int(a['board_id']) == 56, f"Wrong board: {a.get('board_id')}"
          print('Pixhawk6C firmware board_id=56. Build only; no flash.')
          PY
      - name: Build isolated EarlyNative power-on variant
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/gcc-arm-none-eabi-10/bin:/github/home/.local/bin:$PATH"
          ./waf configure --board Pixhawk6C-SpktSmart-EarlyNative-IOInstall
          ./waf plane
          test -s build/Pixhawk6C-SpktSmart-EarlyNative-IOInstall/bin/arduplane.apj
          strings build/Pixhawk6C-SpktSmart-EarlyNative-IOInstall/bin/arduplane | grep -F 'SPK33 BOOT INIT%lums NOW%lums'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/Pixhawk6C-SpktSmart-EarlyNative-IOInstall/bin/arduplane.apj')
          a = json.loads(p.read_text())
          assert int(a['board_id']) == 56
          print('EarlyNative board ID 56 PASS; build only, no flash')
          PY
      - name: Compile separate early armed-bench throttle-cut target (UNQUALIFIED)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/gcc-arm-none-eabi-10/bin:/github/home/.local/bin:$PATH"
          ./waf configure --board Pixhawk6C-SpktSmart-EarlyArmedBench-IOInstall
          ./waf plane
          FW=build/Pixhawk6C-SpktSmart-EarlyArmedBench-IOInstall/bin/arduplane.apj
          test -s "$FW"
          strings build/Pixhawk6C-SpktSmart-EarlyArmedBench-IOInstall/bin/arduplane | grep -F 'SPK33 BOOT INIT%lums NOW%lums'
          strings build/Pixhawk6C-SpktSmart-EarlyArmedBench-IOInstall/bin/arduplane | grep -F 'SPK36 BAD%lu ID%02X SUB%02X B2%02X B3%02X'
          strings build/Pixhawk6C-SpktSmart-EarlyArmedBench-IOInstall/bin/arduplane | grep -F 'SPK40 RET NE%u Q%u P%u'
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/Pixhawk6C-SpktSmart-EarlyArmedBench-IOInstall/bin/arduplane.apj")
          j=json.loads(p.read_text())
          assert int(j["board_id"]) == 56
          print("EarlyArmedBench Board ID 56 PASS; build only, NOT motor qualified")
          PY
      - name: Compile delayed pull-up RX diagnostic A/B image
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/gcc-arm-none-eabi-10/bin:/github/home/.local/bin:$PATH"
          BOARD=Pixhawk6C-SpktSmart-EarlyArmedBench-DelayedRxDiag-IOInstall
          HWDEF=libraries/AP_HAL_ChibiOS/hwdef/$BOARD/hwdef.dat
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_BOOT_DISCOVERY_AFTER_MS 7000' "$HWDEF"
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_RX_DIAG 1' "$HWDEF"
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_AUX7_INTERNAL_PULLUP 1' libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-ArmedBench-IOInstall/hwdef.dat
          ./waf configure --board "$BOARD"
          ./waf plane
          FW=build/$BOARD/bin/arduplane.apj
          test -s "$FW"
          strings build/$BOARD/bin/arduplane | grep -F 'SPK41 TX Q%lu TC%lu REST%lu FA%lu'
          strings build/$BOARD/bin/arduplane | grep -F 'SPK41 PA0 H%u LV%u ED%lu PM%u'
          strings build/$BOARD/bin/arduplane | grep -F 'SPK42 BOOT WAIT%u AT%lums NOW%lums'
          python3 - "$FW" <<'PY'
          import json, sys
          from pathlib import Path
          a=json.loads(Path(sys.argv[1]).read_text())
          assert int(a['board_id']) == 56
          print("Delayed RX diagnostic board ID 56 PASS; no flash")
          PY
      - name: Compile nonflight Early200 0x21-only cold-start handshake image
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/gcc-arm-none-eabi-10/bin:/github/home/.local/bin:$PATH"
          BOARD=Pixhawk6C-SpktSmart-Early200-HSOnly-IOInstall
          HWDEF=libraries/AP_HAL_ChibiOS/hwdef/$BOARD/hwdef.dat
          grep -Fq 'include ../Pixhawk6C-SpktSmart-EarlyNative-IOInstall/hwdef.dat' "$HWDEF"
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_EARLY200_TX_LAB 1' "$HWDEF"
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_EARLY200_RX 1' "$HWDEF"
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_NATIVE_EARLY_BOOT 1' libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-EarlyNative-IOInstall/hwdef.dat
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_AUX7_INTERNAL_PULLUP 1' libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-ArmedBench-IOInstall/hwdef.dat
          ./waf configure --board "$BOARD"
          ./waf plane
          FW=build/$BOARD/bin/arduplane.apj
          test -s "$FW"
          strings build/$BOARD/bin/arduplane | grep -F 'SPK46 HS200 TRY%lums START%u'
          strings build/$BOARD/bin/arduplane | grep -F 'SPK45 TX FIRSTTC%lums LIMIT200'
          strings build/$BOARD/bin/arduplane | grep -F 'SPK44 RX FIRST%lums BYTES%lu'
          python3 - "$FW" <<'PY'
          import json, sys
          from pathlib import Path
          fw=json.loads(Path(sys.argv[1]).read_text())
          assert int(fw['board_id'])==56
          print("Early200 handshake-only board 56 PASS - never ARM / not for flight")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Pix6C-SPKT-Early200-HSOnly
          path: build/Pixhawk6C-SpktSmart-Early200-HSOnly-IOInstall/bin/arduplane.apj
          if-no-files-found: error
          retention-days: 14
      - name: Build Early200 receive-first timing/IO-gated SRXL2 target
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/gcc-arm-none-eabi-10/bin:/github/home/.local/bin:$PATH"
          BOARD=Pixhawk6C-SpktSmart-EarlyArmedBench-Early200-IOInstall
          HWDEF=libraries/AP_HAL_ChibiOS/hwdef/$BOARD/hwdef.dat
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_EARLY200_RX 1' "$HWDEF"
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_BOOT_DISCOVERY_AFTER_MS 0' libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-EarlyArmedBench-AutoBoot-IOInstall/hwdef.dat
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_AUX7_INTERNAL_PULLUP 1' libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-ArmedBench-IOInstall/hwdef.dat
          ./waf configure --board "$BOARD"
          ./waf plane
          FW=build/$BOARD/bin/arduplane.apj
          test -s "$FW"
          strings build/$BOARD/bin/arduplane | grep -F 'SPK44 EARLY BEGIN%lums END%lums'
          strings build/$BOARD/bin/arduplane | grep -F 'SPK44 RX FIRST%lums BYTES%lu'
          strings build/$BOARD/bin/arduplane | grep -F 'SPK45 TX FIRSTTC%lums LIMIT200'
          strings build/$BOARD/bin/arduplane | grep -F 'SPK45 GOAL RX%u TX%u (200ms)'
          python3 - "$FW" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              fw=json.load(f)
          assert int(fw['board_id']) == 56
          print("Early200 board ID 56 PASS - no flash, no motor qualification")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Pix6C-SPKT-Early200-PassiveRX
          path: build/Pixhawk6C-SpktSmart-EarlyArmedBench-Early200-IOInstall/bin/arduplane.apj
          if-no-files-found: error
          retention-days: 14
      - name: Compile immediate AutoBoot SRXL2 RX-first image
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/gcc-arm-none-eabi-10/bin:/github/home/.local/bin:$PATH"
          BOARD=Pixhawk6C-SpktSmart-EarlyArmedBench-AutoBoot-IOInstall
          HWDEF=libraries/AP_HAL_ChibiOS/hwdef/$BOARD/hwdef.dat
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_BOOT_DISCOVERY_AFTER_MS 0' "$HWDEF"
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_FAST_DISARMED_RETRY 1' "$HWDEF"
          grep -Fq 'define AP_SPEKTRUM_SMART_ESC_AUX7_INTERNAL_PULLUP 1' libraries/AP_HAL_ChibiOS/hwdef/Pixhawk6C-SpktSmart-ArmedBench-IOInstall/hwdef.dat
          ./waf configure --board "$BOARD"
          ./waf plane
          FW=build/$BOARD/bin/arduplane.apj
          test -s "$FW"
          strings build/$BOARD/bin/arduplane | grep -F 'SPK42 BOOT WAIT%u AT%lums NOW%lums'
          strings build/$BOARD/bin/arduplane | grep -F 'SPK43 DISC FIRST%lums LAST%lums N%u R%u'
          strings build/$BOARD/bin/arduplane | grep -F 'SPK41 TX Q%lu TC%lu REST%lu FA%lu'
          python3 - "$FW" <<'PY'
          import json, sys
          from pathlib import Path
          a=json.loads(Path(sys.argv[1]).read_text())
          assert int(a['board_id']) == 56
          print("AutoBoot board ID 56 PASS; build only, no flash")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Pix6C-SPKT-AutoBoot-FastDiscovery
          path: build/Pixhawk6C-SpktSmart-EarlyArmedBench-AutoBoot-IOInstall/bin/arduplane.apj
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Pix6C-SPKT-Pullup-DelayedRxDiag
          path: build/Pixhawk6C-SpktSmart-EarlyArmedBench-DelayedRxDiag-IOInstall/bin/arduplane.apj
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Pix6C-SPKT-F7-StartupRecovery
          path: build/Pixhawk6C-SpktSmart-EarlyArmedBench-IOInstall/bin/arduplane.apj
          if-no-files-found: error
          retention-days: 14
